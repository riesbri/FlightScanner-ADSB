# FlightTracker Configuration

# Airport to monitor (IATA code, e.g., VLC, MAD, BCN)
airport.code=VLC

# Scraping interval in minutes
scraper.interval.minutes=60

# Maximum retries for failed scrapes
scraper.max.retries=3

# Retry delay in seconds
scraper.retry.delay.seconds=5

# Database configuration
# Options: sqlite, mysql
db.type=sqlite

# SQLite settings
db.sqlite.url=jdbc:sqlite:flights.db

# MySQL settings (only used if db.type=mysql)
db.mysql.url=jdbc:mysql://localhost:3306/flight_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.mysql.user=${MYSQL_USER:webadmin}
db.mysql.password=${MYSQL_PASSWORD:}

# Connection pool settings
db.pool.size.max=10
db.pool.size.min=2
db.connection.timeout.ms=30000

# Discord notifications (webhook)
discord.enabled=true
discord.webhook.url=${DISCORD_WEBHOOK_URL:}
# Set to true to notify ALL flights (testing), false for widebody/military/bizjet only
discord.notify.all=false

# AI Analysis (DeepSeek)
ai.analysis.enabled=false
deepseek.api.key=${DEEPSEEK_API_KEY:}

# ADS-B Configuration (dump1090-fa)
adsb.enabled=true
adsb.source.type=dump1090
adsb.dump1090.host=localhost
adsb.dump1090.port=30003
adsb.aircraft.timeout.seconds=60
adsb.reconnect.delay.seconds=5
adsb.save.interval.minutes=5
adsb.notification.cooldown.hours=4

# Logging
logging.level.com.richi=INFO
logging.level.root=WARN
