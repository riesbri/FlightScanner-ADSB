# FlightTracker Configuration

# Airport to monitor (IATA code, e.g., VLC, MAD, BCN)
airport.code=VLC

# Scraping interval in minutes
scraper.interval.minutes=60

# Maximum retries for failed scrapes
scraper.max.retries=3

# Retry delay in seconds
scraper.retry.delay.seconds=5

# Database configuration
# Options: sqlite, mysql
db.type=sqlite

# SQLite settings
db.sqlite.url=jdbc:sqlite:flights.db

# MySQL settings (only used if db.type=mysql)
db.mysql.url=jdbc:mysql://localhost:3306/flight_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.mysql.user=${MYSQL_USER:webadmin}
db.mysql.password=${MYSQL_PASSWORD:}

# Connection pool settings
db.pool.size.max=10
db.pool.size.min=2
db.connection.timeout.ms=30000

# Discord notifications (webhook)
discord.enabled=true
discord.webhook.url=${DISCORD_WEBHOOK_URL:}
# Notification tier: all | noteworthy | alert  (default: noteworthy)
#   all       — every detected flight (testing/demo)
#   noteworthy — widebody/military/bizjet (default behavior)
#   alert     — only ALERT-tier events (emergency squawk, low alt, gov hex, mil operator)
discord.notify.level=noteworthy
# Legacy key — deprecated, prefer discord.notify.level. Still honored for backward compat.
# discord.notify.all=false
# Set to true to post a "✅ connected" message on startup (off by default)
discord.startup.test.message=false

# ALERT tier thresholds
adsb.alert.emergency.squawks=7500,7600,7700
adsb.alert.low.altitude.feet=1500
# Government/state ICAO hex ranges (comma-separated low-high pairs, inclusive)
adsb.alert.gov.hex.ranges=0x348000-0x34FFFF
# Military operator substrings — case-insensitive (comma-separated)
adsb.alert.military.operators=Ejercito,Fuerza Aerea,RAAF,USAF,RAF,Luftwaffe,Royal Air Force,Royal Navy,Armee de l Air,Aeronautica Militare
# Cooldown for ALERT notifications per aircraft (minutes)
adsb.alert.cooldown.minutes=5

# ADS-B Configuration (dump1090-fa)
adsb.enabled=true
adsb.source.type=dump1090
adsb.dump1090.host=localhost
adsb.dump1090.port=30003
adsb.aircraft.timeout.seconds=60
adsb.reconnect.delay.seconds=5
adsb.save.interval.minutes=5
adsb.notification.cooldown.hours=4

# Logging
logging.level.com.richi=INFO
logging.level.root=WARN
